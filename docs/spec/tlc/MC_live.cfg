\* Liveness run: module's Fairness, NO SYMMETRY (unsound under liveness).
\* Trim stays enabled (singleton sets) - it has no fairness, may happen or not.
SPECIFICATION MCSpecLive
CONSTANTS
  rA = rA
  rB = rB
  v1 = v1
  v2 = v2
  v3 = v3
  o1 = o1
  o2 = o2
  o3 = o3
  o4 = o4
  c1 = c1
  c2 = c2
  i1 = i1
  i2 = i2
  None = None
  Refs = {rA, rB}
  Vals = {None, v1, v2, v3}
  Objs = {o1, o2, o3, o4}
  Clients = {c1, c2}
  Instances = {i1, i2}
  MaxPushes = 2
  FoldBound = 1
  Reach <- MCReach
  TxnPool <- MCTxnPool
PROPERTIES
  PushTerminates
  ReadsTerminate
  EventuallyFolded
